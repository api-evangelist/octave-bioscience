aid: octave-bioscience
name: Octave Bioscience
description: 'Octave Bioscience is a precision neurology company founded in 2014 and headquartered
  in Menlo Park, California, that develops blood-based multi-protein biomarker tests for chronic
  neurological disease. Its commercially available Octave Multiple Sclerosis Disease Activity (MSDA)
  Test measures a panel of serum proteins to produce a quantitative disease activity score used
  alongside clinical and imaging assessment, and is available across the United States through a
  strategic collaboration with Quest Diagnostics. The company is also developing a Multiple Sclerosis
  Disease Progression (MSDP) test and a Parkinson''s disease biomarker assay supported by a Michael
  J. Fox Foundation grant. Octave publishes a public trust center documenting HITRUST, ISO/IEC
  27001:2022, ISO/IEC 42001:2023, HIPAA and GDPR posture, but operates no public developer program,
  API reference, SDK or machine-readable specification.'
